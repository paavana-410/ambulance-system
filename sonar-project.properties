# =============================================
# SonarCloud Configuration - ResQGo Project
# =============================================
# Register free at: https://sonarcloud.io
# Link your GitHub repo → it scans automatically on every push.

# ── Project Identity ─────────────────────────────────────────────────────────
sonar.projectKey=ResQGo_ambulance
sonar.organization=paavana-410
sonar.projectName=ResQGo Ambulance System
sonar.projectVersion=2.0

# ── Source Paths ─────────────────────────────────────────────────────────────
# Python backend
sonar.sources=opt/ambulance1/ambulance/web
sonar.python.version=3.11

# JavaScript frontend
sonar.javascript.file.suffixes=.js

# ── Exclusions ───────────────────────────────────────────────────────────────
# Don't scan virtualenv, migrations, test fixtures, etc.
sonar.exclusions=\
  **/venv/**,\
  **/.venv/**,\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/build/**,\
  **/.gradle/**,\
  **/migrations/**,\
  **/fix.py,\
  **/rewrite_main.py,\
  **/Driver_app_fix.py,\
  **/create_resqgo_report.py

# ── Coverage (optional – add pytest-cov later) ───────────────────────────────
# sonar.python.coverage.reportPaths=coverage.xml

# ── Encoding ─────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ── Security Rules (SonarCloud detects these automatically) ──────────────────
# - Hardcoded credentials          → FIXED (moved to .env)
# - SQL injection                  → Uses parameterised queries ✅
# - Password hashing               → FIXED (bcrypt) ✅
# - Missing rate limiting          → FIXED (Flask-Limiter) ✅
# - CORS wildcard                  → To review in Phase 2
