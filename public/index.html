<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ResQGo Redirect</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #512da8; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .card { background: white; color: #333; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); max-width: 400px; width: 90%; }
        h1 { color: #f44336; margin-top: 0; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #f44336; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn { display: inline-block; background-color: #512da8; color: white; padding: 12px 24px; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>ResQGo</h1>
        <p>Authenticating your session...</p>
        <div class="loader"></div>
        <p>You should be redirected to the app automatically.</p>
        <a href="https://ambulanceapp-7472c.firebaseapp.com/finishSignUp" class="btn">Open App Manually</a>
    </div>
    <script>
        // Automatic redirection attempt
        setTimeout(function() {
            window.location.href = window.location.href; // Refresh triggers deep link again
        }, 2000);
    </script>
</body>
</html>
